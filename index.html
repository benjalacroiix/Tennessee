<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Tennessee | Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { red: '#DC2626', black: '#0A0A0A', card: '#111111' } },
          fontFamily: { logo: ['"Playfair Display"', 'serif'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { background-color: #0A0A0A; color: #fff; }
    ::selection { background: #DC2626; color: #fff; }
    /* 16px en inputs para que el iPhone no haga zoom al tocarlos */
    input, select, textarea { font-size: 16px; }
    .field { width: 100%; background: #0A0A0A; border: 1px solid rgba(255,255,255,.18); border-radius: 12px; padding: 12px 14px; color: #fff; outline: none; transition: border-color .15s; }
    .field:focus { border-color: #DC2626; }
    .field::placeholder { color: rgba(255,255,255,.3); }
    .label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 6px; }
    .chip { border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.8); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; min-width: 48px; transition: all .15s; }
    .chip:hover { border-color: #DC2626; }
    .chip.active { background: #DC2626; border-color: #DC2626; color: #fff; }
    input[type=checkbox] { accent-color: #DC2626; width: 20px; height: 20px; }
  </style>
</head>

<body class="font-sans antialiased min-h-screen">

  <!-- =====================================================
       VISTA 1: LOGIN
  ====================================================== -->
  <section id="view-login" class="hidden min-h-screen flex items-center justify-center px-5">
    <div class="w-full max-w-sm">
      <p class="font-logo italic font-bold text-5xl text-brand-red text-center leading-none">Tennessee</p>
      <p class="text-center text-xs font-black uppercase tracking-widest text-white/50 mt-3 mb-8">Panel de administración</p>

      <form id="login-form" class="bg-brand-card border border-white/10 rounded-2xl p-6 space-y-4">
        <div>
          <label class="label" for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="username" required class="field" placeholder="tu@email.com" />
        </div>
        <div>
          <label class="label" for="login-pass">Contraseña</label>
          <div class="relative">
            <input id="login-pass" type="password" autocomplete="current-password" required class="field pr-20" placeholder="••••••••" />
            <button type="button" id="toggle-pass" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-bold uppercase tracking-widest text-white/50 hover:text-white px-2 py-1">Ver</button>
          </div>
        </div>
        <p id="login-error" class="hidden text-sm font-semibold text-brand-red"></p>
        <button id="login-btn" type="submit" class="w-full bg-brand-red hover:bg-red-700 disabled:opacity-50 text-white text-sm font-black uppercase tracking-widest py-3.5 rounded-full transition">Ingresar</button>
      </form>

      <a href="index.html" class="block text-center text-xs text-white/40 hover:text-white mt-6 transition">← Volver a la tienda</a>
    </div>
  </section>

  <!-- =====================================================
       VISTA 2: PANEL
  ====================================================== -->
  <div id="view-panel" class="hidden">

    <header class="sticky top-0 z-30 bg-black/80 backdrop-blur-md border-b border-white/10">
      <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <div class="flex items-baseline gap-2">
          <span class="font-logo italic font-bold text-3xl text-brand-red leading-none">Tennessee</span>
          <span class="text-[10px] font-black uppercase tracking-widest text-white/50">Admin</span>
        </div>
        <div class="flex items-center gap-2">
          <a href="index.html" target="_blank" class="text-xs font-bold uppercase tracking-widest border border-white/20 hover:border-brand-red hover:text-brand-red px-3 py-2 rounded-full transition">Ver tienda</a>
          <button id="logout-btn" type="button" class="text-xs font-bold uppercase tracking-widest bg-white text-black hover:bg-brand-red hover:text-white px-3 py-2 rounded-full transition">Salir</button>
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 grid gap-8 lg:grid-cols-[380px_1fr] lg:items-start">

      <!-- ================= FORMULARIO ================= -->
      <section id="form-section" class="bg-brand-card border border-white/10 rounded-2xl p-5 lg:sticky lg:top-24">
        <div class="flex items-center justify-between mb-4">
          <h2 id="form-title" class="font-black uppercase tracking-widest text-sm">Nueva prenda</h2>
          <button id="cancel-edit" type="button" class="hidden text-xs font-bold uppercase tracking-widest text-white/50 hover:text-brand-red">Cancelar</button>
        </div>

        <form id="form-prenda" class="space-y-4" novalidate>

          <!-- Foto -->
          <div>
            <span class="label">Foto</span>
            <label for="f-foto" class="block cursor-pointer">
              <div id="foto-box" class="relative aspect-[4/5] w-full max-w-[220px] rounded-xl border border-dashed border-white/25 hover:border-brand-red bg-black overflow-hidden flex items-center justify-center text-center transition">
                <div id="foto-placeholder" class="px-4 text-white/50 text-sm">
                  <svg class="w-8 h-8 mx-auto mb-2 text-white/40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
                  Tocá para sacar o elegir una foto
                </div>
                <img id="foto-preview" class="hidden absolute inset-0 w-full h-full object-cover" alt="Vista previa" />
              </div>
            </label>
            <input id="f-foto" type="file" accept="image/*" class="hidden" />
            <p id="foto-info" class="text-xs text-white/40 mt-2"></p>
          </div>

          <div>
            <label class="label" for="f-nombre">Nombre</label>
            <input id="f-nombre" type="text" class="field" placeholder='Ej: Remera Roja "Angel"' maxlength="120" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label" for="f-precio">Precio (ARS)</label>
              <input id="f-precio" type="number" inputmode="numeric" min="0" step="1" class="field" placeholder="10000" />
            </div>
            <div>
              <label class="label" for="f-categoria">Categoría</label>
              <input id="f-categoria" type="text" list="dl-categorias" class="field" placeholder="Remeras" maxlength="40" />
              <datalist id="dl-categorias"></datalist>
            </div>
          </div>

          <!-- Talle (1 por prenda) -->
          <div>
            <span class="label">Talle</span>
            <div id="talles" class="flex flex-wrap gap-2"></div>
            <input id="f-talle-otro" type="text" class="field mt-3" placeholder="Otro talle (ej: 44, L frente y espalda)" maxlength="40" />
          </div>

          <div>
            <label class="label" for="f-estado">Estado de la prenda</label>
            <input id="f-estado" type="text" list="dl-estados" class="field" placeholder="Excelente, Impecable, 10/10…" maxlength="40" />
            <datalist id="dl-estados">
              <option value="Excelente 10/10"></option><option value="Impecable 10/10"></option><option value="10/10"></option>
              <option value="Impecable"></option><option value="Excelente"></option><option value="Muy bueno"></option><option value="Bueno"></option>
            </datalist>
          </div>

          <div class="flex flex-col gap-3 pt-1">
            <label class="flex items-center gap-3 text-sm font-semibold cursor-pointer">
              <input id="f-stock" type="checkbox" checked /> En stock
            </label>
            <label class="flex items-center gap-3 text-sm font-semibold cursor-pointer">
              <input id="f-destacado" type="checkbox" /> Destacado ★
            </label>
          </div>

          <p id="form-error" class="hidden text-sm font-semibold text-brand-red"></p>

          <button id="save-btn" type="submit" class="w-full bg-brand-red hover:bg-red-700 disabled:opacity-50 disabled:cursor-wait text-white text-sm font-black uppercase tracking-widest py-3.5 rounded-full transition">Guardar prenda</button>
        </form>
      </section>

      <!-- ================= LISTADO ================= -->
      <section>
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4">
          <div>
            <h2 class="font-black uppercase tracking-widest text-sm">Prendas cargadas</h2>
            <p id="resumen" class="text-xs text-white/50 mt-1">Cargando…</p>
          </div>
          <input id="buscar" type="search" class="field sm:max-w-[220px]" placeholder="Buscar por nombre…" />
        </div>

        <div id="lista" class="space-y-3"></div>
      </section>
    </main>
  </div>

  <!-- Aviso flotante -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-white text-black text-sm font-bold px-5 py-3 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 max-w-[90vw] text-center"></div>

  <script>
    /* ---------- CONFIGURACIÓN ---------- */
    const SUPABASE_URL = "https://eukoeahroszsgfvvmqvd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OP5xAIRGmvCxIYq5eWhEtw_sebgKO4L";
    const BUCKET = "prendas";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Talles rápidos (editá esta lista a gusto)
    const TALLES = ["Único", "XS", "S", "M", "L", "XL", "XXL", "38", "40", "42", "44", "46"];
    const CATEGORIAS_BASE = ["Remeras", "Sweaters", "Buzos", "Pantalones", "Shorts", "Gorras", "Accesorios"];

    /* ---------- ESTADO ---------- */
    let productos = [];
    let editandoId = null;
    let fotoBlob = null;       // foto comprimida lista para subir
    let fotoPreviewUrl = null;
    let talleSel = "";
    let guardando = false;
    let logueado = false;

    /* ---------- UTILIDADES ---------- */
    const $ = (id) => document.getElementById(id);
    const formatoPrecio = (n) => "$" + Number(n).toLocaleString("es-AR");
    const escapar = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let toastTimer;
    function aviso(texto) {
      const t = $("toast");
      t.textContent = texto;
      t.classList.remove("opacity-0");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add("opacity-0"), 2600);
    }

    function mensajeError(err) {
      const m = (err && err.message) || String(err);
      if (/Invalid login credentials/i.test(m)) return "Email o contraseña incorrectos.";
      if (/Email not confirmed/i.test(m)) return "Ese email todavía no está confirmado en Supabase.";
      if (/Failed to fetch|NetworkError/i.test(m)) return "Sin conexión con el servidor. Revisá tu internet.";
      if (/row-level security|permission denied/i.test(m)) return "Sin permiso. Volvé a iniciar sesión.";
      return m;
    }

    /* =====================================================
       AUTENTICACIÓN
    ===================================================== */
    function aplicarSesion(session) {
      const hay = !!session;
      $("view-login").classList.toggle("hidden", hay);
      $("view-panel").classList.toggle("hidden", !hay);
      if (hay && !logueado) { cargarProductos(); }
      logueado = hay;
    }

    // setTimeout evita bloquear a supabase-js si hacemos llamadas dentro del callback
    sb.auth.onAuthStateChange((_evento, session) => setTimeout(() => aplicarSesion(session), 0));
    sb.auth.getSession().then(({ data }) => aplicarSesion(data.session));

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = $("login-error");
      const btn = $("login-btn");
      err.classList.add("hidden");
      btn.disabled = true; btn.textContent = "Ingresando…";
      const { error } = await sb.auth.signInWithPassword({
        email: $("login-email").value.trim(),
        password: $("login-pass").value
      });
      btn.disabled = false; btn.textContent = "Ingresar";
      if (error) { err.textContent = mensajeError(error); err.classList.remove("hidden"); }
      else { $("login-pass").value = ""; }
    });

    $("toggle-pass").addEventListener("click", () => {
      const i = $("login-pass");
      const ver = i.type === "password";
      i.type = ver ? "text" : "password";
      $("toggle-pass").textContent = ver ? "Ocultar" : "Ver";
    });

    $("logout-btn").addEventListener("click", async () => { await sb.auth.signOut(); });

    /* =====================================================
       FOTO: elegir, comprimir y subir
       Las fotos del celular pesan varios MB: se reducen a
       máx. 1600 px (JPG) antes de subirlas.
    ===================================================== */
    function cargarImg(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No pude leer esa foto. Probá con una JPG o PNG.")); };
        img.src = url;
      });
    }

    async function comprimirImagen(file, maxLado = 1600, calidad = 0.82) {
      let bmp;
      try { bmp = await createImageBitmap(file, { imageOrientation: "from-image" }); }
      catch (e) { bmp = await cargarImg(file); }
      const ancho = bmp.naturalWidth || bmp.width;
      const alto = bmp.naturalHeight || bmp.height;
      const esc = Math.min(1, maxLado / Math.max(ancho, alto));
      const w = Math.round(ancho * esc), h = Math.round(alto * esc);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);   // fondo blanco para PNG con transparencia
      ctx.drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      return new Promise((resolve, reject) =>
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("No se pudo procesar la foto."))), "image/jpeg", calidad));
    }

    function mostrarPreview(url) {
      $("foto-preview").src = url;
      $("foto-preview").classList.remove("hidden");
      $("foto-placeholder").classList.add("hidden");
    }
    function limpiarPreview() {
      if (fotoPreviewUrl) { URL.revokeObjectURL(fotoPreviewUrl); fotoPreviewUrl = null; }
      $("foto-preview").classList.add("hidden");
      $("foto-preview").removeAttribute("src");
      $("foto-placeholder").classList.remove("hidden");
      $("foto-info").textContent = "";
    }

    $("f-foto").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      $("foto-info").textContent = "Procesando foto…";
      try {
        const blob = await comprimirImagen(file);
        fotoBlob = blob;
        if (fotoPreviewUrl) URL.revokeObjectURL(fotoPreviewUrl);
        fotoPreviewUrl = URL.createObjectURL(blob);
        mostrarPreview(fotoPreviewUrl);
        $("foto-info").textContent = `Lista para subir (${(blob.size / 1024).toFixed(0)} KB)`;
      } catch (err) {
        fotoBlob = null;
        $("foto-info").textContent = mensajeError(err);
      }
      e.target.value = "";   // permite volver a elegir la misma foto
    });

    function nuevoNombreArchivo() {
      const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2);
      return `${id}.jpg`;
    }

    async function subirFoto(blob) {
      const path = nuevoNombreArchivo();
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, {
        contentType: "image/jpeg", cacheControl: "31536000", upsert: false
      });
      if (error) throw error;
      const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
      return { path, url: data.publicUrl };
    }

    async function borrarFoto(path) {
      if (!path) return;
      try { await sb.storage.from(BUCKET).remove([path]); } catch (e) { console.warn("No se pudo borrar la foto", e); }
    }

    /* =====================================================
       TALLES (1 por prenda)
    ===================================================== */
    function renderTalles() {
      $("talles").innerHTML = TALLES.map((t) =>
        `<button type="button" data-talle="${escapar(t)}" class="chip ${t === talleSel ? "active" : ""}">${escapar(t)}</button>`).join("");
    }
    $("talles").addEventListener("click", (e) => {
      const b = e.target.closest("[data-talle]");
      if (!b) return;
      talleSel = talleSel === b.dataset.talle ? "" : b.dataset.talle;
      $("f-talle-otro").value = "";
      renderTalles();
    });
    $("f-talle-otro").addEventListener("input", () => {
      if ($("f-talle-otro").value.trim()) { talleSel = ""; renderTalles(); }
    });

    /* =====================================================
       FORMULARIO: crear / editar
    ===================================================== */
    function setGuardando(v, texto) {
      guardando = v;
      $("save-btn").disabled = v;
      $("save-btn").textContent = v ? texto : (editandoId ? "Guardar cambios" : "Guardar prenda");
    }

    function mostrarErrorForm(msg) {
      const e = $("form-error");
      if (!msg) { e.classList.add("hidden"); return; }
      e.textContent = msg; e.classList.remove("hidden");
    }

    function resetForm() {
      editandoId = null; fotoBlob = null; talleSel = "";
      $("form-prenda").reset();
      $("f-stock").checked = true;
      limpiarPreview();
      renderTalles();
      mostrarErrorForm("");
      $("form-title").textContent = "Nueva prenda";
      $("cancel-edit").classList.add("hidden");
      $("save-btn").textContent = "Guardar prenda";
    }

    function editarPrenda(id) {
      const p = productos.find((x) => x.id === id);
      if (!p) return;
      resetForm();
      editandoId = id;
      $("f-nombre").value = p.nombre || "";
      $("f-precio").value = p.precio ?? "";
      $("f-categoria").value = p.categoria || "";
      $("f-estado").value = p.estado || "";
      $("f-stock").checked = !!p.en_stock;
      $("f-destacado").checked = !!p.destacado;
      const t = (p.talles && p.talles[0]) || "";
      if (TALLES.includes(t)) talleSel = t; else $("f-talle-otro").value = t;
      renderTalles();
      if (p.imagen_url) { mostrarPreview(p.imagen_url); $("foto-info").textContent = "Foto actual. Elegí otra solo si querés reemplazarla."; }
      $("form-title").textContent = "Editando prenda";
      $("cancel-edit").classList.remove("hidden");
      $("save-btn").textContent = "Guardar cambios";
      $("form-section").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("cancel-edit").addEventListener("click", resetForm);

    $("form-prenda").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (guardando) return;
      mostrarErrorForm("");

      const nombre = $("f-nombre").value.trim();
      const precioTxt = $("f-precio").value.trim();
      const precio = Number(precioTxt);
      const categoria = $("f-categoria").value.trim() || "General";
      const talle = $("f-talle-otro").value.trim() || talleSel;
      const estado = $("f-estado").value.trim() || null;

      if (!nombre) return mostrarErrorForm("Poné el nombre de la prenda.");
      if (precioTxt === "" || !isFinite(precio) || precio < 0) return mostrarErrorForm("Poné un precio válido.");
      if (!talle) return mostrarErrorForm("Elegí un talle.");
      if (!editandoId && !fotoBlob) return mostrarErrorForm("Falta la foto de la prenda.");

      const datos = { nombre, precio, categoria, talles: [talle], estado, en_stock: $("f-stock").checked, destacado: $("f-destacado").checked };

      setGuardando(true, fotoBlob ? "Subiendo foto…" : "Guardando…");
      let subida = null;
      let dbOk = false;
      try {
        if (fotoBlob) subida = await subirFoto(fotoBlob);
        setGuardando(true, "Guardando…");

        if (editandoId) {
          const previo = productos.find((x) => x.id === editandoId);
          if (subida) { datos.imagen_url = subida.url; datos.imagen_path = subida.path; }
          const { data, error } = await sb.from("productos").update(datos).eq("id", editandoId).select();
          if (error) throw error;
          if (!data || !data.length) throw new Error("No se guardó. ¿Venció la sesión? Volvé a ingresar.");
          dbOk = true;
          if (subida && previo && previo.imagen_path) await borrarFoto(previo.imagen_path);   // limpia la foto vieja
          aviso("Cambios guardados ✔");
        } else {
          datos.imagen_url = subida.url; datos.imagen_path = subida.path;
          const { error } = await sb.from("productos").insert(datos);
          if (error) throw error;
          dbOk = true;
          aviso("Prenda cargada ✔");
        }
        resetForm();
        await cargarProductos();
      } catch (err) {
        if (subida && !dbOk) await borrarFoto(subida.path);   // no dejamos fotos huérfanas
        mostrarErrorForm(mensajeError(err));
      } finally {
        setGuardando(false);
      }
    });

    /* =====================================================
       LISTADO + ACCIONES RÁPIDAS
    ===================================================== */
    async function cargarProductos() {
      const { data, error } = await sb.from("productos").select("*").order("created_at", { ascending: false });
      if (error) { $("resumen").textContent = "Error al cargar: " + mensajeError(error); return; }
      productos = data || [];
      actualizarCategorias();
      renderLista();
    }

    function actualizarCategorias() {
      const set = new Set([...CATEGORIAS_BASE, ...productos.map((p) => p.categoria).filter(Boolean)]);
      $("dl-categorias").innerHTML = [...set].map((c) => `<option value="${escapar(c)}"></option>`).join("");
    }

    function renderLista() {
      const q = $("buscar").value.trim().toLowerCase();
      const lista = productos.filter((p) => !q || (p.nombre || "").toLowerCase().includes(q) || (p.categoria || "").toLowerCase().includes(q));

      const enStock = productos.filter((p) => p.en_stock).length;
      $("resumen").textContent = `${productos.length} prendas · ${enStock} en stock · ${productos.length - enStock} sin stock`;

      if (!lista.length) {
        $("lista").innerHTML = `<p class="text-center text-white/40 py-12 text-sm">${productos.length ? "No hay resultados para esa búsqueda." : "Todavía no cargaste prendas."}</p>`;
        return;
      }

      $("lista").innerHTML = lista.map((p) => `
        <article class="bg-brand-card border border-white/10 rounded-2xl p-3 flex gap-3 ${p.id === editandoId ? "ring-1 ring-brand-red" : ""}">
          <div class="relative w-20 h-24 sm:w-24 sm:h-28 shrink-0 rounded-xl overflow-hidden bg-black flex items-center justify-center">
            <span class="text-white/20 font-logo italic text-2xl">T</span>
            ${p.imagen_url ? `<img src="${escapar(p.imagen_url)}" alt="" loading="lazy" onerror="this.style.display='none'" class="absolute inset-0 w-full h-full object-cover ${p.en_stock ? "" : "opacity-40 grayscale"}" />` : ""}
          </div>

          <div class="flex-1 min-w-0 flex flex-col">
            <div class="flex items-start justify-between gap-2">
              <h3 class="font-bold text-sm leading-snug truncate-2">${escapar(p.nombre)}${p.destacado ? ' <span class="text-brand-red">★</span>' : ""}</h3>
              <p class="font-black text-sm whitespace-nowrap">${formatoPrecio(p.precio)}</p>
            </div>
            <p class="text-xs text-white/50 mt-0.5">${escapar(p.categoria)} · Talle ${escapar((p.talles || []).join(" / ") || "—")}${p.estado ? " · " + escapar(p.estado) : ""}</p>

            <div class="mt-auto pt-3 flex flex-wrap gap-2">
              <button type="button" data-accion="stock" data-id="${escapar(p.id)}"
                class="text-[11px] font-black uppercase tracking-widest px-3 py-2 rounded-full transition ${p.en_stock ? "bg-white text-black hover:bg-brand-red hover:text-white" : "bg-brand-red text-white hover:bg-red-700"}">
                ${p.en_stock ? "● En stock" : "○ Sin stock"}
              </button>
              <button type="button" data-accion="destacado" data-id="${escapar(p.id)}" aria-label="Destacar"
                class="text-[11px] font-black px-3 py-2 rounded-full border transition ${p.destacado ? "border-brand-red text-brand-red" : "border-white/20 text-white/60 hover:border-brand-red"}">★</button>
              <button type="button" data-accion="editar" data-id="${escapar(p.id)}"
                class="text-[11px] font-black uppercase tracking-widest px-3 py-2 rounded-full border border-white/20 hover:border-white transition">Editar</button>
              <button type="button" data-accion="eliminar" data-id="${escapar(p.id)}"
                class="text-[11px] font-black uppercase tracking-widest px-3 py-2 rounded-full border border-brand-red/50 text-brand-red hover:bg-brand-red hover:text-white transition">Eliminar</button>
            </div>
          </div>
        </article>`).join("");
    }

    $("buscar").addEventListener("input", renderLista);

    // Actualiza una prenda y verifica que RLS realmente la dejó modificar
    async function actualizar(id, cambios) {
      const { data, error } = await sb.from("productos").update(cambios).eq("id", id).select();
      if (error) throw error;
      if (!data || !data.length) throw new Error("No se guardó. ¿Venció la sesión? Volvé a ingresar.");
      return data[0];
    }

    async function eliminarPrenda(p) {
      const sinFotoEnStorage = !p.imagen_path && p.imagen_url;
      const ok = confirm(`¿Eliminar "${p.nombre}"?\n\nSe borra la prenda${p.imagen_path ? " y su foto" : ""}. No se puede deshacer.`);
      if (!ok) return;
      const { data, error } = await sb.from("productos").delete().eq("id", p.id).select();
      if (error) throw error;
      if (!data || !data.length) throw new Error("No se eliminó. ¿Venció la sesión? Volvé a ingresar.");
      await borrarFoto(p.imagen_path);
      if (editandoId === p.id) resetForm();
      aviso(sinFotoEnStorage ? "Prenda eliminada (su foto está en tu carpeta img/, no en Supabase)" : "Prenda eliminada ✔");
    }

    $("lista").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-accion]");
      if (!btn) return;
      const p = productos.find((x) => x.id === btn.dataset.id);
      if (!p) return;
      const accion = btn.dataset.accion;

      if (accion === "editar") { editarPrenda(p.id); return; }

      btn.disabled = true;
      try {
        if (accion === "stock") {
          await actualizar(p.id, { en_stock: !p.en_stock });
          aviso(!p.en_stock ? "Marcada EN STOCK" : "Marcada SIN STOCK");
        } else if (accion === "destacado") {
          await actualizar(p.id, { destacado: !p.destacado });
          aviso(!p.destacado ? "Prenda destacada ★" : "Quitada de destacados");
        } else if (accion === "eliminar") {
          await eliminarPrenda(p);
        }
        await cargarProductos();
      } catch (err) {
        aviso("Error: " + mensajeError(err));
        btn.disabled = false;
      }
    });

    /* ---------- INICIO ---------- */
    renderTalles();
  </script>
</body>
</html>
